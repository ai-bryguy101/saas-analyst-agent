- id: GF01
  difficulty: hard
  kind: buried-in-email
  question: Why did Harbortown Property Group cancel in 2016?
  answer: Two outages in March 2016 (Mar 8 and Mar 22) plus a competitor (Plinthwise) quoting ~30% under the renewal. The
    CRM churn reason says 'Other' because the VP Sales asked for it to be logged that way.
  trail:
  - data/raw/email_archive/sales_bkittredge_2014-2017.mbox (thread 'Notice of non-renewal - Harbortown', Aug 1 2016)
  - data/raw/crm_salesforce_export_2026-10/Account.csv (Churn_Reason__c = Other)
  - data/raw/support_helpdesk_2011-2019/tickets_export.json.gz (urgent outage tickets, March 2016)
  - data/raw/crm_salesforce_export_2026-10/Task.csv (June 2016 call note says 'all good' - misleading)
  traps:
  - CRM reason is 'Other'
  - call notes say renewal looked routine
