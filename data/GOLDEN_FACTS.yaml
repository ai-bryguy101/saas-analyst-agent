patterns:
- id: P01
  kind: churn driver
  strength: strong
  summary: US cloud customers who used the QuickBooks Online connector after v2 shipped (2024-06-11) and hit repeated sync
    failures churned at 41% (Sep 2024 to Oct 2026) versus 9% for everyone else.
  how_to_find: Join Zendesk tickets tagged integration-sync (organization -> ops_tenant) to usage exports (tenant disappears
    after churn). Churners with 3+ sync tickets show a 40-50% drop in mau over their last five months.
  sources:
  - data/raw/support_zendesk_2020-2026/
  - data/raw/product_usage_exports/
  - data/raw/product_changelog/CHANGELOG.md (4.7.0, 4.8.1)
  - data/raw/sales_calls_gong/cs_*.json
  - data/raw/phone_backups/sms_csm_*_2025.xml
  - data/raw/billing_v3_2017-now/subscriptions.csv
  noise: About 4% of non-connector customers file a sync ticket too; most churners also have ordinary tickets; only 23 of
    the 115 connector churners have a CRM churn reason that points at product or reliability.
  values:
    connector_customers: 280
    population: 1092
    churned_connector: 115
    churned_other: 72
    churn_rate_connector: 0.411
    churn_rate_other: 0.089
    gong_calls: 54
- id: P02
  kind: seasonal and regional trend
  strength: moderate
  summary: Facilities, property management and hospitality customers in southern states run 1.71x as many work orders in June
    to August as in December to February; everyone else runs 1.08x. They also file extra scheduling tickets each summer.
  how_to_find: Group usage exports by month and by the customer's state and industry (state and industry live in the CRM,
    not in the usage files), then compare summer and winter.
  sources:
  - data/raw/product_usage_exports/
  - data/raw/crm_salesforce_export_2026-10/Account.csv
  - data/raw/support_zendesk_2020-2026/
  noise: Per-customer work order rates vary 2x and every month has +/-15% noise; the column name changes in 2023.
  values:
    segment_customers: 146
    summer_winter_ratio_segment: 1.71
    summer_winter_ratio_rest: 1.08
- id: P03
  kind: product change -> complaints
  strength: strong
  summary: Mobile 5.0.0 (2025-02-10) removed the offline photo queue. Offline-photo tickets went from 1.7 a week to 20.8 a
    week and the average store rating fell from 4.25 to 2.38, recovering to 4.09 after 5.0.3 (2025-03-24).
  how_to_find: Weekly counts of tickets tagged offline or mentioning photos, lined up against the changelog and the two store
    exports.
