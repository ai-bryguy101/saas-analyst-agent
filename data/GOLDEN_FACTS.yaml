- id: GF06
  difficulty: hard
  kind: timezone-dst
  question: How long was the November 5, 2017 outage?
  answer: About 100 minutes (06:20-08:00 UTC; 01:20 CDT to 02:00 CST). The logs are in local Dallas time with no offset and
    the 1 AM hour repeats at the DST change, so a naive read (and the postmortem) says 40 minutes.
  trail:
  - data/raw/app_logs/app-2017-11-04_05.dal-app03.log (req= sequence numbers keep increasing through the repeated hour)
  - data/raw/wiki_confluence_export/ENG/Postmortem-2017-11-05-DB-pool-exhaustion.html (says ~40 min)
  - 'data/raw/jira_export_2026-10/ENG.json (ENG-1180: logs were local time until 2018-03-12)'
